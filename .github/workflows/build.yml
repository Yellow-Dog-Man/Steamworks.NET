name: Build Library

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'

jobs:
  dotnet-build:
    name: 'Build dotnet solution'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Build solution'
        uses: Yellow-Dog-Man/composite-actions-templates/.github/actions/dotnet-build@main
        with:
          dotnet-project-path: 'Standalone2.0/Steamworks.NET.Standard.sln'
          dotnet-build-args : '-t:BatchBuild'


      - name: 'Upload artifacts'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'steamworks-standard'
          path: '**/bin/**/**/**/*.dll'
